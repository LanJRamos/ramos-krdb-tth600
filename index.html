<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kamen Rider Watch Tracker</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

    <!-- NAVIGATION -->
    <header class="navbar">

        <div class="logo">
            🏍 KAMEN RIDER WATCH TRACKER
        </div>

        <nav>

            <a href="index.html" class="active">
                Home
            </a>

            <a href="series.html">
                My Series
            </a>

            <a href="series-form.html" id="add-series-link">
                Add Series
            </a>

        </nav>

    </header>


    <main class="container">

        <!-- HERO -->
        <section class="hero">

            <h1>
                Kamen Rider Watch Tracker
            </h1>

            <p>
                Keep track of the Kamen Rider series you're watching
                and your viewing progress.
            </p>

        </section>


        <!-- STATISTICS -->
        <section class="stats">

            <div class="stat-card">

                <span class="stat-label">
                    Total Series
                </span>

                <span class="stat-number" id="total-series">
                    0
                </span>

            </div>


            <div class="stat-card">

                <span class="stat-label">
                    Currently Watching
                </span>

                <span class="stat-number" id="watching-series">
                    0
                </span>

            </div>


            <div class="stat-card">

                <span class="stat-label">
                    Completed
                </span>

                <span class="stat-number" id="completed-series">
                    0
                </span>

            </div>

        </section>


        <!-- CURRENTLY WATCHING -->
        <section class="dashboard-section">

            <div class="section-header">

                <h2>
                    Currently Watching
                </h2>

            </div>


            <div id="watching-container" class="series-grid">
                <!-- Generated by JavaScript -->
            </div>

        </section>


        <!-- ACTIONS -->
        <section class="dashboard-actions">

            <a href="series.html" class="action-button">
                View My Series
            </a>


            <a href="series-form.html" class="action-button" onclick="localStorage.removeItem('editingSeriesId')">
                + Add Series
            </a>

        </section>

    </main>


    <script src="js/app.js"></script>

</body>

</html>
