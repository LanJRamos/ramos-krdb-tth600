<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Series | Kamen Rider Watch Tracker</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

    <!-- NAVIGATION -->
    <header class="navbar">

        <div class="logo">
            🏍 KAMEN RIDER WATCH TRACKER
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="series.html">
                My Series
            </a>

            <a href="series-form.html" id="add-series-link" class="active">
                Add Series
            </a>

        </nav>

    </header>


    <main class="container">

        <!-- FORM -->
        <section class="form-section">

            <h1 id="form-title">
                Add Series
            </h1>

            <p class="form-description">
                Add a Kamen Rider series to your watch tracker.
            </p>


            <form id="series-form">

                <!-- Series Title -->
                <div class="form-group">

                    <label for="title">
                        Series Title
                    </label>

                    <input type="text" id="title" placeholder="e.g. Kamen Rider Kuuga" required>

                </div>


                <!-- Start Year / Era -->
                <div class="form-row">

                    <div class="form-group">

                        <label for="start-year">
                            Start Year
                        </label>

                        <input type="number" id="start-year" placeholder="2000" min="1971" required>

                    </div>


                    <div class="form-group">

                        <label for="era">
                            Era
                        </label>

                        <select id="era" required>

                            <option value="">
                                Select Era
                            </option>

                            <option value="Showa">
                                Showa
                            </option>

                            <option value="Heisei">
                                Heisei
                            </option>

                            <option value="Reiwa">
                                Reiwa
                            </option>

                        </select>

                    </div>

                </div>


                <!-- End Year -->
                <div class="form-group">

                    <label for="end-year">
                        End Year
                    </label>

                    <input type="number" id="end-year" placeholder="e.g. 2001" min="1971">

                    <label class="checkbox-label">

                        <input type="checkbox" id="still-airing">

                        Still Airing

                    </label>

                </div>


                <!-- Episodes Released -->
                <div class="form-group">

                    <label for="episodes">
                        Episodes Released
                    </label>

                    <input type="number" id="episodes" placeholder="49" min="1" required>

                </div>


                <!-- Theme -->
                <div class="form-group">

                    <label for="theme">
                        Theme
                    </label>

                    <input type="text" id="theme" placeholder="e.g. Detectives / Mystery" required>

                </div>


                <!-- Watch Status -->
                <div class="form-group">

                    <label for="status">
                        Watch Status
                    </label>

                    <select id="status" required>

                        <option value="">
                            Select Status
                        </option>

                        <option value="Plan to Watch">
                            Plan to Watch
                        </option>

                        <option value="Watching">
                            Watching
                        </option>

                        <option value="On Hold">
                            On Hold
                        </option>

                        <option value="Completed">
                            Completed
                        </option>

                    </select>

                </div>


                <!-- Watched Episode -->
                <div class="form-group">

                    <label for="watched-episode">
                        Watched Episode
                    </label>

                    <input type="number" id="watched-episode" placeholder="0" min="0" required>

                    <small class="input-help">
                        Enter the latest episode you have completely watched.
                    </small>

                </div>


                <!-- Buttons -->
                <div class="form-actions">

                    <button type="submit" class="action-button">

                        <span id="submit-text">
                            Save Series
                        </span>

                    </button>


                    <a href="series.html" class="cancel-button" onclick="localStorage.removeItem('editingSeriesId')">
                        Cancel
                    </a>

                </div>

            </form>

        </section>

    </main>


    <script src="js/app.js"></script>

</body>

</html>
