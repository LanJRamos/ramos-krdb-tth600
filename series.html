<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Series | Kamen Rider Watch Tracker</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="navbar">

        <div class="logo">
            🏍 KAMEN RIDER WATCH TRACKER
        </div>

        <nav>
            <a href="index.html">
                Home
            </a>

            <a href="series.html" class="active">
                My Series
            </a>

            <a href="series-form.html" id="add-series-link">
                Add Series
            </a>
        </nav>

    </header>


    <main class="container">

        <!-- Page Header -->
        <div class="page-header">

            <div>

                <h1>My Series</h1>

                <p>
                    Track your Kamen Rider viewing progress.
                </p>

            </div>


            <a href="series-form.html" class="action-button" onclick="localStorage.removeItem('editingSeriesId')">
                + Add Series
            </a>

        </div>


        <!-- Search -->
        <div class="search-box">

            <input type="text" id="search-input" placeholder="Search by title, era, theme, status, or year...">

        </div>


        <!-- Series -->
        <section id="series-container" class="series-grid">
            <!-- Series cards generated by JavaScript -->
        </section>

    </main>


    <script src="js/app.js"></script>

</body>

</html>
